<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>DDC — Daddy Don't Care Co.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div class="brand-wrap" data-nav="home" role="button" tabindex="0">
        <div class="brand">DDC <span class="crown">♛</span></div>
        <div class="brand-sub">Daddy Don't Care Co.</div>
      </div>
      <button class="points-pill" data-nav="rewards" aria-label="Open rewards">
        <span class="points-label">POINTS</span>
        <strong id="pointsTop">250</strong>
      </button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="home" class="active"><span>⌂</span>HOME</button>
      <button data-nav="university"><span>🎓</span>LEARN</button>
      <button data-nav="challenge"><span>⚡</span>DO</button>
      <button data-nav="crew"><span>👥</span>CREW</button>
      <button data-nav="me"><span>◎</span>YOU</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
