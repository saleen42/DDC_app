<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DDC — Daddy Don't Care Co.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23080a0f'/%3E%3Ctext x='18' y='92' font-family='Arial Black, Arial, sans-serif' font-weight='900' font-size='58' fill='white'%3EDDC%3C/text%3E%3Ctext x='116' y='70' font-family='Arial, sans-serif' font-size='32' fill='%23ff168f'%3E%E2%99%9B%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="noise"></div>
  <div id="app-shell">
    <header class="topbar">
      <button class="brand-wrap ghost" data-nav="home" aria-label="Go home">
        <div class="brand-line">
          <div class="brand">DDC</div>
          <div class="crown">♛</div>
        </div>
        <div class="brand-sub">DADDY DON'T CARE CO.</div>
      </button>
      <button class="points-pill" data-nav="rewards" aria-label="Open rewards">
        <span class="points-label">POINTS</span>
        <strong id="pointsTop">250</strong>
      </button>
    </header>

    <main id="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="home" class="active"><span>⌂</span>HOME</button>
      <button data-nav="university"><span>🎓</span>LEARN</button>
      <button data-nav="challenge"><span>⚡</span>DO</button>
      <button data-nav="crew"><span>👥</span>CREW</button>
      <button data-nav="me"><span>◎</span>YOU</button>
    </nav>
  </div>

  <div id="dropModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-badge">FUCK YEAH DROP</div>
      <h2 id="dropTitle">+25 BONUS POINTS</h2>
      <p id="dropText">Nice. The app noticed you actually did something.</p>
      <button id="closeDrop" class="primary-btn">HELL YEAH</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
